<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#211d1b">
  <title>LCS · Bathroom concepts</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #211d1b; color: #efe7dd; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 1720px; margin: auto; padding: 32px 20px 48px; }
    header { max-width: 820px; margin-bottom: 28px; }
    .eyebrow { color: #b9a69a; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; margin: 0 0 12px; }
    h1 { font-size: clamp(28px, 4vw, 42px); font-weight: 580; margin: 0 0 12px; letter-spacing: -.03em; }
    p { line-height: 1.55; margin: 0; color: #c5b8aa; }
    .views { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
    figure { margin: 0; min-width: 0; }
    figcaption { margin: 0 0 12px; display: flex; align-items: baseline; gap: 10px; line-height: 1.4; }
    .number { color: #b9a69a; font-size: 12px; }
    a { color: inherit; }
    a:focus-visible { outline: 3px solid #e2bf9a; outline-offset: 5px; }
    img { display: block; width: 100%; height: auto; background: #312820; border-radius: 5px; }
    .open { display: inline-block; font-size: 13px; margin-top: 12px; color: #d9c0a9; text-underline-offset: 3px; }
    footer { font-size: 13px; color: #b9a69a; line-height: 1.5; margin-top: 32px; }
    @media (max-width: 960px) { .views { grid-template-columns: 1fr; gap: 32px; } main { padding: 24px 14px 36px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Leg City Sounds · Apartment</p>
      <h1>Bathroom concepts</h1>
      <p>Two opposing views of one lived-in bathroom: a wall-to-wall tub, warm light, worn tiles, improvised storage and two roommates’ everyday things.</p>
    </header>
    <div class="views">
      <figure>
        <figcaption><span class="number">01</span> From the entrance toward the bath</figcaption>
        <a href="concept-a-entry-to-bath.png" aria-label="Open the entrance bathroom concept at full size"><img src="concept-a-entry-to-bath.png" alt="A warm industrial bathroom facing the bathtub and small city window, with a water heater and radiator on the left, basin and mirror on the right, personal toiletries and laundry on lines." width="1536" height="1024" fetchpriority="high"></a>
        <a class="open" href="concept-a-entry-to-bath.png">Open full size</a>
      </figure>
      <figure>
        <figcaption><span class="number">02</span> From the bath back toward the entrance</figcaption>
        <a href="concept-b-bath-to-entry.png" aria-label="Open the reverse bathroom concept at full size"><img src="concept-b-bath-to-entry.png" alt="The same bathroom facing its worn steel entrance door, with the basin and warm mirror lights on the left and wire shelves, radiator, cream water heater and toilet on the right." width="1536" height="1024" loading="lazy"></a>
        <a class="open" href="concept-b-bath-to-entry.png">Open full size</a>
      </figure>
    </div>
    <footer>Proposed concept pair · 10 October 2026. Tap either image to inspect it at full size.</footer>
  </main>
</body>
</html>
