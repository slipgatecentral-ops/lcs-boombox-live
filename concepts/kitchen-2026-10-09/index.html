<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#201b17">
  <title>LCS · Kitchen concepts</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #201b17; color: #eee4d7; }
    body { margin: 0; }
    main { max-width: 1400px; margin: auto; padding: 24px 16px 40px; }
    h1 { margin: 0 0 8px; font-size: clamp(24px, 4vw, 36px); font-weight: 600; }
    p { margin: 0 0 24px; color: #c9b9a7; line-height: 1.5; }
    figure { margin: 0 0 32px; }
    figcaption { margin: 0 0 10px; font-size: 17px; }
    a { color: inherit; }
    img { width: 100%; height: auto; display: block; border-radius: 6px; background: #302923; }
    a:focus-visible { outline: 3px solid #ddb886; outline-offset: 5px; }
    .hint { font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>Kitchen concepts</h1>
    <p>Two opposing views of one lived-in kitchen: coffee, warm light, useful shelves and everyday clutter.</p>
    <figure>
      <figcaption>1 · From the entrance toward the coffee corner</figcaption>
      <a href="concept-a.png" aria-label="Open the first kitchen concept at full size">
        <img src="concept-a.png" alt="Warm industrial kitchen with a sticker-covered cream refrigerator, breakfast clutter, red chairs, open wall shelves and an espresso corner." width="1586" height="992" fetchpriority="high">
      </a>
    </figure>
    <figure>
      <figcaption>2 · From the coffee corner back toward the entrance</figcaption>
      <a href="concept-b.png" aria-label="Open the second kitchen concept at full size">
        <img src="concept-b.png" alt="The same cozy kitchen from the opposite end, with the dining table and mug shelf on the left, window and sink on the right, and the refrigerator beside the doorway." width="1586" height="992" loading="lazy">
      </a>
    </figure>
    <p class="hint">Tap either picture to open it at full size. Concept artwork · 9 October 2026.</p>
  </main>
</body>
</html>
