<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vienna's reading library · LCS</title>
<style>
:root{color-scheme:dark;font-family:Georgia,serif;background:#211d19;color:#e9dfcf}*{box-sizing:border-box}body{margin:0}main{max-width:1320px;margin:auto;padding:24px}a{color:#dfba77}header{padding:12px 0 22px;border-bottom:1px solid #635443}h1{font-weight:400;font-size:clamp(30px,5vw,52px);margin:18px 0 10px}p{line-height:1.5;max-width:740px;color:#baa994}nav{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 12px}button,input{font:14px system-ui;background:#332b23;color:#e9dfcf;border:1px solid #6b5946;border-radius:3px;padding:10px 13px}button{cursor:pointer}button[aria-pressed=true]{background:#b09364;color:#201b15}input{min-width:200px;flex:1}#count{font:13px system-ui;color:#baa994;margin-bottom:22px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:28px 24px}.card{min-width:0}.jacket{display:grid;grid-template-columns:1fr .194444fr;gap:5px;filter:drop-shadow(0 6px 6px #0005)}.face{width:100%;aspect-ratio:2/3;background-repeat:no-repeat;background-color:#786c57}.spine{aspect-ratio:28/216;background-repeat:no-repeat;background-color:#786c57}h2{font-weight:400;font-size:19px;line-height:1.25;margin:13px 0 7px}.category{font:11px system-ui;letter-spacing:.11em;text-transform:uppercase;color:#ba9b6e}.notice{padding:30px 0;color:#baa994}@media(max-width:520px){main{padding:18px 14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 12px}h2{font-size:16px}nav{gap:6px}button{padding:9px;font-size:12px}input{width:100%;flex-basis:100%}.jacket{gap:3px}}
</style></head><body><main><header><a href="../">← Props catalog</a><h1>Vienna's reading library</h1><p>Strange fiction for the quiet hours. Practical knowledge for the next repair, set or tape run.</p></header>
<nav aria-label="Library filters"><button data-cat="all" aria-pressed="true">All 48</button><button data-cat="fiction" aria-pressed="false">Fiction 24</button><button data-cat="technical" aria-pressed="false">Technical 24</button><button id="side" aria-pressed="false">Show backs</button><input id="search" type="search" placeholder="Search titles" aria-label="Search book titles"></nav><div id="count" aria-live="polite">Loading the library…</div><section class="grid" id="books" aria-label="Book jackets"></section><div id="error" class="notice" hidden></div>
</main><script type="module">
let category='all',back=false,query='',meta,rows=[],atlas;
const root=new URL('../../props-data/',location.href),grid=document.querySelector('#books'),count=document.querySelector('#count');
function printTile(el,r){const w=(r.u1-r.u0)*meta.width,h=(r.v1-r.v0)*meta.width,x=r.u0*meta.width,y=r.v0*meta.width;el.style.backgroundImage=`url("${atlas}")`;el.style.backgroundSize=`${meta.width/w*100}% ${meta.height/h*100}%`;el.style.backgroundPosition=`${x/(meta.width-w)*100}% ${y/(meta.height-h)*100}%`;}
function draw(){const visible=rows.filter(r=>(category==='all'||r.category===category)&&r.title.toLowerCase().includes(query));grid.replaceChildren();for(const r of visible){const card=document.createElement('article');card.className='card';const jacket=document.createElement('div');jacket.className='jacket';const face=document.createElement('div');face.className='face';face.setAttribute('role','img');face.setAttribute('aria-label',r.title+(back?' back cover':' front cover'));printTile(face,back?meta.items[r.back]:r);const spine=document.createElement('div');spine.className='spine';spine.setAttribute('aria-hidden','true');printTile(spine,meta.items[r.spine]);jacket.append(face,spine);const title=document.createElement('h2');title.textContent=r.title;const label=document.createElement('div');label.className='category';label.textContent=r.category;card.append(jacket,title,label);grid.append(card);}count.textContent=`${visible.length} of 48 books · ${back?'Back covers':'Front covers'}`;window.__bookLibrary={ready:true,visible:visible.length,total:rows.length,categories:Object.fromEntries(['fiction','technical'].map(c=>[c,rows.filter(r=>r.category===c).length])),atlas:atlas.href};}
document.querySelectorAll('[data-cat]').forEach(b=>b.addEventListener('click',()=>{category=b.dataset.cat;document.querySelectorAll('[data-cat]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));draw();}));document.querySelector('#side').addEventListener('click',e=>{back=!back;e.currentTarget.textContent=back?'Show fronts':'Show backs';e.currentTarget.setAttribute('aria-pressed',String(back));draw();});document.querySelector('#search').addEventListener('input',e=>{query=e.currentTarget.value.trim().toLowerCase();draw();});
try{const manifest=await fetch(new URL('manifest.json',root),{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error();return r.json();});const m=new URL(manifest.books?.manifest??'books.json',root);m.searchParams.set('v',manifest.stamp);meta=await fetch(m).then(r=>{if(!r.ok)throw Error();return r.json();});atlas=new URL(meta.png,root);atlas.searchParams.set('v',manifest.stamp);const image=new Image();image.src=atlas.href;await image.decode();rows=Object.values(meta.items).filter(r=>r.bookPart==='front').sort((a,b)=>a.book.localeCompare(b.book));if(rows.length!==48)throw Error();draw();}catch{count.textContent='';const e=document.querySelector('#error');e.hidden=false;e.textContent='The library could not load. Please refresh in a moment.';}
</script></body></html>
